name: SNS 주간 인사이트 수집

# SUS-230 Phase 2 (P-20) — 인스타·스레드 주간 지표를 모아 추세를 쌓고 요약을 남긴다.
# 매주 월 09:00 KST 에 "직전 주(월~일)" 를 집계한다.
#
# 🔴 토큰은 GitHub Secrets 에서만 주입한다(IG_ACCESS_TOKEN·THREADS_ACCESS_TOKEN = 자동 게시용 재사용).
# 🔴 Slack 은 선택 — SLACK_WEBHOOK_MARKETING 시크릿이 없으면 전송만 건너뛰고 수집은 성공한다.
# ⚠️ 이 레포는 공개다. Actions 로그·Job Summary·insights/ 커밋은 모두 누구나 볼 수 있다
#    (개인정보는 없고 우리 계정의 집계 수치만 담긴다 — SUS-230 §8).
on:
  schedule:
    - cron: '0 0 * * 1' # 매주 월요일 00:00 UTC = 09:00 KST
  workflow_dispatch:
    inputs:
      dry_run:
        description: '수집만 하고 파일 저장·커밋은 하지 않음(첫 실행 시 실제 반환 지표 확인용)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: social-insights
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15    # Meta 가 5xx 를 뿜는 날 기본 360분 러너 점유 방지
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 시크릿 주입 스텝보다 먼저 — 테스트 코드가 토큰에 접근할 수 없게 한다.
      - name: 단위 테스트 (순수 함수 — 네트워크·토큰 불필요)
        run: |
          set -euo pipefail
          node scripts/__tests__/collect-insights.test.mjs

      # continue-on-error: 부분 실패(한쪽 채널 접속키 만료 등)해도 그 주 데이터는 커밋해 보존한다.
      #   실패 자체는 마지막 스텝에서 빨간불로 드러낸다 — "감지" 와 "보존" 을 분리한다.
      #   (분리 안 하면 만성 실패 시 insights/ 에 파일이 영영 하나도 안 쌓인다.)
      - name: 인사이트 수집
        id: collect
        continue-on-error: true
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          # 미등록이면 빈 값 → 스크립트가 Slack 전송만 건너뛴다(실패 아님).
          SLACK_WEBHOOK_MARKETING: ${{ secrets.SLACK_WEBHOOK_MARKETING }}
          # 🔴 ${{ }} 를 run: 안에서 직접 보간하지 않는다(셸 인젝션 표면 제거) — env 로만 받는다.
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN:-false}" = "true" ]; then
            node scripts/collect-insights.mjs --dry-run
          else
            node scripts/collect-insights.mjs
          fi

      - name: 스냅샷 커밋 (변경분 있을 때만)
        if: ${{ inputs.dry_run != true }}
        run: |
          set -euo pipefail
          if [ ! -d insights ]; then
            echo "insights/ 없음 — 수집 결과 파일이 만들어지지 않았습니다. 커밋 생략."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add insights/
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "chore(insights): SNS 주간 지표 수집 [skip ci]"
          # 카드뉴스 자동 발행과 겹치면 non-fast-forward 가 날 수 있다 — 리베이스 후 재시도.
          for i in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            if [ "$i" = 3 ]; then break; fi
            echo "push 충돌 — 리베이스 후 재시도 ${i}/2"
            git pull --rebase --autostash origin main || {
              git rebase --abort 2>/dev/null || true
              echo "::error::리베이스 실패 — 수동 확인 필요"
              exit 1
            }
          done
          echo "::error::insights 커밋 push 실패(3회 시도)"
          exit 1

      # 수집이 부분 실패했으면 잡을 빨간불로 남긴다(위에서 데이터 보존은 이미 끝냈다).
      - name: 부분 수집 실패 표시
        if: ${{ steps.collect.outcome == 'failure' }}
        run: |
          echo "::error::일부 채널 수집 실패 — 위 '인사이트 수집' 로그의 (건너뜀) 항목과 접속키 만료 여부를 확인하세요."
          exit 1
