name: 스레드 일간 지표 수집

# 매일 최근 게시물 25건의 지표(조회·좋아요·답글·리포스트·인용)와 팔로워 수를
# threads/metrics/YYYY-MM-DD.json 으로 커밋한다 — 자율 발행 루틴의 학습 데이터.
# (클라우드 루틴은 GitHub Secrets 토큰에 접근할 수 없으므로 이 워크플로가 지표를 레포에 적재한다.)
# 매일 10:30 KST — 정오 발행 루틴(12:00 KST)이 당일 최신 지표를 읽고 학습하도록 그 직전에 돈다.
# ⚠️ 이 레포는 공개다. 커밋되는 지표는 우리 계정 공개 게시물의 집계 수치뿐이다(주간 social-insights 와 동일 원칙).
on:
  schedule:
    - cron: '30 1 * * *' # 01:30 UTC = 10:30 KST
  workflow_dispatch:
    inputs:
      dry_run:
        description: '수집만 하고 파일 저장·커밋은 하지 않음'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: threads-metrics
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 시크릿 주입 스텝보다 먼저 — 테스트 코드가 토큰에 접근할 수 없게 한다.
      - name: 단위 테스트 (순수 함수 — 네트워크·토큰 불필요)
        run: node scripts/__tests__/post-thread-text.test.mjs

      - name: 지표 수집
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ -z "${THREADS_ACCESS_TOKEN:-}" ]; then
            echo "ℹ️ THREADS_ACCESS_TOKEN 미설정 — 이번 회차 건너뜀"; exit 0
          fi
          if [ "${DRY_RUN:-false}" = "true" ]; then
            node scripts/collect-threads-metrics.mjs --dry-run
          else
            node scripts/collect-threads-metrics.mjs
          fi

      - name: 지표 파일 커밋 (변경분 있을 때만)
        if: ${{ inputs.dry_run != true }}
        run: |
          set -euo pipefail
          if [ ! -d threads/metrics ]; then
            echo "threads/metrics 없음 — 수집이 건너뛰어졌거나 실패해 기록할 것이 없습니다. 커밋 생략."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- threads/metrics
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"; exit 0
          fi
          git commit -m "chore(threads): 일간 지표 수집 [skip ci]"
          # 댓글 자동응답(15분 주기) 등 다른 워크플로 push 와 겹치면 non-fast-forward 가 날 수 있다.
          for i in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            if [ "$i" = 3 ]; then break; fi
            echo "push 충돌 — 리베이스 후 재시도 ${i}/2"
            git pull --rebase --autostash origin main || {
              git rebase --abort 2>/dev/null || true
              echo "::error::리베이스 실패 — 수동 확인 필요"
              exit 1
            }
          done
          echo "::error::지표 커밋 push 실패(3회 시도) — 그날 스냅샷 유실 위험"
          exit 1
