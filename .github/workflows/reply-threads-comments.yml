name: 스레드 댓글 자동응답

# 우리 스레드 게시물에 달린 새 답글을 찾아 Claude로 반말 답글을 만들어 자동 게시한다.
# 15분마다 폴링 — 실시간 웹훅 대신 GitHub Actions 스케줄을 쓴다(별도 서버 호스팅 불필요).
#
# 🔴 완전 자동 게시(사람 승인 없음)로 운영하기로 결정했다 — 브랜드 리스크는
#    scripts/reply-comments.mjs 의 상태 파일(중복 방지) + 스킵 판단(스팸·욕설·무관 필터링) +
#    1회 실행당 게시 상한으로 최소화한다. 자세한 내용은 README "스레드 댓글 자동응답" 참고.
# 🔴 시크릿: THREADS_ACCESS_TOKEN(threads_manage_replies 스코프 필요 — 기존 토큰에 없으면
#    Meta 앱 재인가 필요) + ANTHROPIC_API_KEY(신규 등록 필요).
# ⚠️ 이 레포는 공개다. Actions 로그·Job Summary·state/ 커밋은 누구나 볼 수 있다
#    (개인정보는 없고, 우리 계정이 이미 공개 게시한 답글 요약과 처리 시각만 담긴다).
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '실제 게시 없이 판단 결과만 로그로 확인(상태 파일도 저장하지 않음)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: reply-threads-comments
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 의존성 설치
        run: npm install --ignore-scripts # Playwright 크로미움 설치(postinstall)는 이 워크플로에 불필요

      # 시크릿 주입 스텝보다 먼저 — 테스트 코드가 토큰에 접근할 수 없게 한다.
      - name: 단위 테스트 (순수 함수 — 네트워크·토큰·Claude 호출 불필요)
        run: node scripts/__tests__/reply-comments.test.mjs

      - name: 댓글 확인 + 답글 생성/게시
        id: reply
        continue-on-error: true
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 🔴 ${{ }} 를 run: 안에서 직접 보간하지 않는다(셸 인젝션 표면 제거) — env 로만 받는다.
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ -z "${THREADS_ACCESS_TOKEN:-}" ]; then
            echo "ℹ️ THREADS_ACCESS_TOKEN 미설정 — 이번 회차 건너뜀"
            exit 0
          fi
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "ℹ️ ANTHROPIC_API_KEY 미설정 — 이번 회차 건너뜀"
            exit 0
          fi
          if [ "${DRY_RUN:-false}" = "true" ]; then
            node scripts/reply-comments.mjs --dry-run
          else
            node scripts/reply-comments.mjs
          fi

      - name: 상태 파일 커밋 (변경분 있을 때만)
        if: ${{ inputs.dry_run != true }}
        run: |
          set -euo pipefail
          if [ ! -d state ]; then
            echo "state/ 없음 — 처리한 답글이 없어 상태 파일이 만들어지지 않았습니다. 커밋 생략."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "chore(threads-replies): 댓글 자동응답 처리 기록 [skip ci]"
          # 15분 간격이라도 다른 워크플로(카드뉴스 발행 등)와 겹치면 non-fast-forward 가 날 수 있다.
          for i in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            if [ "$i" = 3 ]; then break; fi
            echo "push 충돌 — 리베이스 후 재시도 ${i}/2"
            git pull --rebase --autostash origin main || {
              git rebase --abort 2>/dev/null || true
              echo "::error::리베이스 실패 — 수동 확인 필요"
              exit 1
            }
          done
          echo "::error::state 커밋 push 실패(3회 시도)"
          exit 1

      # 답글 생성/게시가 부분 실패해도(개별 답글 오류) 처리된 분은 이미 커밋됐다 — 잡만 빨간불로 남긴다.
      - name: 실행 실패 표시
        if: ${{ steps.reply.outcome == 'failure' }}
        run: |
          echo "::error::댓글 자동응답 중 오류 발생 — 위 '댓글 확인 + 답글 생성/게시' 로그를 확인하세요."
          exit 1
