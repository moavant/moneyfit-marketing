name: 스레드 참여형 텍스트 게시

# threads/posts/ 에 새 게시물 JSON 이 main 에 올라오면 → 텍스트 전용으로 스레드에 게시.
# 카드뉴스(인스타) 파이프라인(publish-instagram.yml)과 완전 분리 — 이미지 없음, 렌더 없음.
# 게시물 작성은 별도 클라우드 루틴이 담당하고, 이 워크플로는 게시만 한다.
# followUp 필드가 있으면 본글 게시 직후 자기 댓글 1개를 이어서 단다.
#
# 멱등성: 게시 성공분은 state/threads-posted.json 에 기록·커밋된다 — 잡 재실행 시
#   이미 게시된 파일은 스크립트가 스스로 건너뛴다(공개 계정 중복 게시 방지).
on:
  push:
    branches: [main]
    paths:
      - 'threads/posts/**'
  workflow_dispatch:
    inputs:
      file:
        description: '게시할 threads/posts/*.json 경로 (수동 실행은 필수 — 비우면 아무것도 게시하지 않음)'
        required: false
      dry_run:
        description: '실제 게시 없이 정화(sanitize) 결과만 로그로 확인(상태 파일도 저장하지 않음)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: threads-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 시크릿 주입 스텝보다 먼저 — 테스트 코드가 토큰에 접근할 수 없게 한다.
      - name: 단위 테스트 (순수 함수 — 네트워크·토큰 불필요)
        run: node scripts/__tests__/post-thread-text.test.mjs

      # 🔴 잡 재실행은 트리거 시점의 SHA 로 체크아웃된다 — 직전 실행이 push 한 게시 기록
      #    (state/threads-posted.json)이 작업 트리에 없어 중복 게시 가드가 무력화된다.
      #    origin/main 최신에서 state/ 만 끌어와 멱등성을 복원한다.
      - name: 최신 게시 기록 동기화 (재실행 중복 게시 방지)
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout FETCH_HEAD -- state/ 2>/dev/null || echo "state/ 아직 없음 — 첫 게시로 간주"

      - name: 게시 대상 결정
        id: target
        env:
          # 🔴 ${{ }} 를 run: 안에서 직접 보간하지 않는다(셸 인젝션 표면 제거) — env 로만 받는다.
          IN_FILE: ${{ github.event.inputs.file }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          FILES=""
          if [ -n "${IN_FILE:-}" ]; then
            # 수동 지정은 threads/posts/*.json 만 허용(경로 화이트리스트)
            case "$IN_FILE" in
              threads/posts/*.json) FILES="$IN_FILE" ;;
              *) echo "::error::허용되지 않는 경로: threads/posts/*.json 만 게시 가능"; exit 1 ;;
            esac
          elif [ "$EVENT_NAME" = "push" ]; then
            # 이번 푸시에서 "새로 추가된"(A) JSON 만 게시 대상 (수정은 재게시 안 함)
            if git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              FILES=$(git diff --name-only --diff-filter=A "$BEFORE_SHA" "$HEAD_SHA" -- 'threads/posts/*.json' || true)
            fi
            if [ -z "$FILES" ]; then
              echo "::warning::threads/posts 푸시인데 신규 추가(A) JSON 이 0건 — 덮어쓰기(M)·확장자·force-push 여부 확인 (필요 시 workflow_dispatch 로 수동 게시)"
            fi
          fi
          echo "게시 대상:"; echo "${FILES:-(없음)}"
          {
            echo "files<<EOF"
            echo "$FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 스레드 게시
        id: post
        if: steps.target.outputs.files != ''
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          FILES: ${{ steps.target.outputs.files }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ -z "${THREADS_ACCESS_TOKEN:-}" ] && [ "${DRY_RUN:-false}" != "true" ]; then
            echo "✗ THREADS_ACCESS_TOKEN 미설정 — 게시 불가"; exit 1
          fi
          COUNT=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            # 1회 실행당 게시 상한(3건) — 버그성 대량 커밋으로 피드 도배 + 잡 타임아웃 방지
            if [ "$COUNT" -ge 3 ]; then
              echo "::warning::1회 실행 게시 상한(3건) 초과 — 건너뜀: $f (workflow_dispatch 로 개별 게시 가능)"
              continue
            fi
            # 같은 푸시에 여러 건이면 사이에 간격(동시 게시로 피드 도배 방지)
            [ "$COUNT" -gt 0 ] && sleep 60
            COUNT=$((COUNT + 1))
            echo "▶ 게시: $f"
            if [ "${DRY_RUN:-false}" = "true" ]; then
              node scripts/post-thread-text.mjs "$f" --dry-run
            else
              node scripts/post-thread-text.mjs "$f"
            fi
          done <<< "$FILES"
          echo "✅ 완료 (${COUNT}건 처리)"

      # 게시 기록(state/threads-posted.json) 커밋 — 재실행 중복 게시 방지의 핵심.
      # 게시 스텝이 중간에 실패했어도 성공분 기록은 남겨야 하므로 always 조건이 아니라
      # "post 스텝이 실행됐다면" 커밋한다(성공/실패 무관, dry-run 제외).
      - name: 게시 기록 커밋
        if: ${{ always() && steps.post.conclusion != 'skipped' && inputs.dry_run != true }}
        run: |
          set -euo pipefail
          if [ ! -d state ]; then
            echo "state/ 없음 — 게시 성공분이 없어 기록할 것이 없습니다. 커밋 생략."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "chore(threads): 게시 기록 [skip ci]"
          # 댓글 자동응답(15분 주기) 등 다른 워크플로 push 와 겹치면 non-fast-forward 가 날 수 있다.
          for i in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            if [ "$i" = 3 ]; then break; fi
            echo "push 충돌 — 리베이스 후 재시도 ${i}/2"
            git pull --rebase --autostash origin main || {
              git rebase --abort 2>/dev/null || true
              echo "::error::리베이스 실패 — 수동 확인 필요"
              exit 1
            }
          done
          echo "::error::게시 기록 push 실패(3회 시도) — 재실행 시 중복 게시 위험, state/threads-posted.json 수동 확인 필요"
          exit 1

      # Slack 보고 — 클라우드 루틴(작성자)의 실행환경은 hooks.slack.com 이 네트워크 정책으로
      # 차단되어 있어(2026-08-26 진단, DEC-208) 웹훅 보고를 여기(GitHub 러너)에서 대신 보낸다.
      # 실제 게시가 끝난 뒤에 보고가 나가므로 "push 만 되고 게시 실패"인 회차를 성공으로 잘못
      # 보고하던 여지도 없어진다. followUp 등 본문 정보는 공개 JSON 에서만 읽는다(전략 메타데이터 없음).
      - name: Slack 보고 (발행 완료)
        if: ${{ always() && steps.post.conclusion == 'success' && inputs.dry_run != true }}
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_THREADS }}
          FILES: ${{ steps.target.outputs.files }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK:-}" ]; then
            echo "::warning::SLACK_WEBHOOK_THREADS 미설정 — Slack 보고 생략"
            exit 0
          fi
          NL=$'\n'
          HOUR=$(TZ=Asia/Seoul date +%H)
          TEXT="🧵 [스레드] ${HOUR}시 회차 발행 완료"
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            FIRST=$(jq -r '.text | split("\n")[0]' "$f" | head -c 80)
            FU=$(jq -r 'if (.followUp // "") != "" then "있음" else "없음" end' "$f")
            TEXT="${TEXT}${NL}• $(basename "$f") — followUp ${FU}${NL}  첫 줄: ${FIRST}"
          done <<< "$FILES"
          jq -n --arg text "$TEXT" '{text: $text}' \
            | curl -sS --fail-with-body -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK" \
            || echo "::warning::Slack 보고 실패 — 게시 자체는 완료됨(보고만 누락)"

      - name: Slack 보고 (게시 실패)
        if: ${{ failure() && inputs.dry_run != true }}
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_THREADS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [ -z "${SLACK_WEBHOOK:-}" ] && exit 0
          NL=$'\n'
          jq -n --arg text "⚠️ [스레드] 자동 게시 워크플로 실패 — 이번 회차 글이 게시되지 않았을 수 있습니다.${NL}로그: ${RUN_URL}" '{text: $text}' \
            | curl -sS --fail-with-body -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK" \
            || echo "::warning::Slack 실패 보고도 발송 실패"
